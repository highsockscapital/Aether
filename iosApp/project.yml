name: Sunshine
options:
  bundleIdPrefix: com.highsockscapital
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
projectReferences:
  libarchive:
    path: ../third_party/ish-arm64/deps/libarchive.xcodeproj
packages:
  Runestone:
    url: https://github.com/simonbs/Runestone.git
    exactVersion: 0.5.2
targets:
  Sunshine:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Runtime
      - path: ../third_party/ish-arm64/tools/fakefs.c
        group: iSH Runtime
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Runtime/bridge.mjs
      - path: Resources/Runtime/extension-bridge.mjs
        buildPhase: resources
      - path: Resources/Runtime/root.tar.gz
        buildPhase: resources
      - path: Resources/Runtime/extensions
        type: folder
        buildPhase: resources
      - path: ../third_party/ish-arm64/app/RootfsPatch.bundle/files/lib/wasm-polyfill.js
        group: Resources
        buildPhase: resources
      - path: ../third_party/ish-arm64/app/RootfsPatch.bundle/files/lib/fetch-polyfill.js
        group: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        group: Licenses
        buildPhase: resources
      - path: ../LICENSE
        group: Licenses
        buildPhase: resources
      - path: ../third_party/ish-arm64/LICENSE.md
        group: Licenses
        buildPhase: resources
      - path: ../third_party/ish-arm64/LICENSE.IOS
        group: Licenses
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).agent.*
        UIBackgroundModes:
          - processing
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Sunshine accesses local network services only when you connect a self-hosted AI provider or MCP server.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    dependencies:
      - target: SunshineFileProvider
      - target: libarchive/libarchive
      - package: Runestone
      - sdk: SystemConfiguration.framework
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Prepare Alpine and Pi Bridge
        script: |
          "$SRCROOT/../scripts/prepare-ios-runtime.sh" "$SRCROOT/Resources/Runtime"
        basedOnDependencyAnalysis: false
      - name: Build SunshineShared
        script: |
          cd "$SRCROOT/.."
          bash ./gradlew -Psunshine.sharedOnly=true :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
      - name: Build iSH ARM64 Runtime
        script: |
          "$SRCROOT/../scripts/build-ios-ish-runtime.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sunshine.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: YES
  SunshineFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileProvider
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Sunshine File Provider
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionFileProviderDocumentGroup: group.com.highsockscapital.sunshine
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.highsockscapital.sunshine.fileprovider
        PRODUCT_NAME: SunshineFileProvider
        PRODUCT_MODULE_NAME: SunshineFileProvider
        CODE_SIGN_ENTITLEMENTS: Sunshine.entitlements
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ""
    dependencies: []
  SunshineRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Runtime
    dependencies:
      - target: Sunshine
    settings:
      base:
        PRODUCT_NAME: SunshineRuntimeTests
        PRODUCT_MODULE_NAME: SunshineRuntimeTests
        PRODUCT_BUNDLE_IDENTIFIER: com.highsockscapital.sunshine.runtime-tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: -framework SunshineShared
        GENERATE_INFOPLIST_FILE: YES
  SunshineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UI
    dependencies:
      - target: Sunshine
    settings:
      base:
        PRODUCT_NAME: SunshineUITests
        PRODUCT_MODULE_NAME: SunshineUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.highsockscapital.sunshine.ui-tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sunshine:
    build:
      targets:
        Sunshine: all
        SunshineFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SunshineRuntimeTests
        - SunshineUITests
    archive:
      config: Release
