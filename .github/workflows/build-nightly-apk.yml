name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'pi-bridge/**'
      - 'packages/extension-api/**'
      - 'third_party/termux/terminal-emulator/**'
      - 'third_party/termux/terminal-view/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-nightly-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Build Metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version_name=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Restore Signing Key
        shell: bash
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sunshine-signing"
          if [ -n "$NIGHTLY_KEYSTORE_BASE64" ]; then
            echo "$NIGHTLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sunshine-signing/sunshine-nightly.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore secret found, falling back to debug signing."
          fi
        id: keystore

      - name: Build APK
        env:
          NIGHTLY_KEYSTORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && format('{0}/sunshine-signing/sunshine-nightly.jks', runner.temp) || '' }}
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          NIGHTLY_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: ./gradlew :app:assembleNightly --stacktrace -Psunshine.versionName="$VERSION_NAME"

      - name: Rename APK to sunshine.apk
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/nightly/app-nightly.apk dist/sunshine.apk
          ls -lh dist/sunshine.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sunshine
          path: dist/sunshine.apk
