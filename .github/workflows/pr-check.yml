name: PR Check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.manual.outputs.android || steps.filter.outputs.android }}
    steps:
      - name: Run all checks for manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "android=true" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'app/**'
              - 'shared/**'
              - 'pi-bridge/**'
              - 'packages/extension-api/**'
              - 'third_party/termux/**'
              - '.github/workflows/build-nightly-apk.yml'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/pr-check.yml'

  android:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test shared and Android code
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Debug signing report
        run: ./gradlew :app:signingReport --stacktrace | grep -A6 "Variant: debug" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Sunshine-pr-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

